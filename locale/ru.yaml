input_command:
  other: "Введите команду: "
fatal_error:
  other: "Произошла критическая ошибка."
report_issue:
  other: |
    Если хотите сообщить об этой ошибке, откройте issue на
    https://github.com/bedrock-tool/bedrocktool/issues
    и приложите информацию об ошибке, опишите, что вы делали, и, если можно, приложите файл bedrocktool.log.
    Спасибо!
used_extra_debug_report:
  other: |
    ВНИМАНИЕ: вы использовали extra-debug, который создаёт файлы packets.log и packets.log.gpg.
    Если хотите отправить issue, загружайте только файл packets.log.gpg.
    packets.log и packets.log.gpg могут содержать данные аккаунта (но никогда данные для входа), поэтому безопаснее загружать зашифрованный файл.
    Этот файл может прочитать только разработчик, а не те, кто смотрит публичную страницу issue.
