report_issue:
  other: |
    このエラーを報告する場合は、次のページで issue を作成してください:
    https://github.com/bedrock-tool/bedrocktool/issues
    エラー情報を添付し、エラーが出るまでに何をしたかを書いて、できれば bedrocktool.log ファイルも添付してください。
    ありがとうございます!
used_extra_debug_report:
  other: |
    注意: extra-debug を使ったため、packets.log と packets.log.gpg ファイルが作られています。
    issue を送る場合は、packets.log.gpg ファイルだけをアップロードしてください。
    packets.log と packets.log.gpg にはアカウント情報が含まれることがあります(ログイン情報は含まれません)。暗号化されたファイルをアップロードするほうが安全です。
    そのファイルは開発者だけが読めて、公開の issue ページを見る人には読めません。
