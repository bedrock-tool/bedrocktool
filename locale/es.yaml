fatal_error:
  other: "Se produjo un error fatal."
report_issue:
  other: |
    Si quieres informar de este error, abre una incidencia en
    https://github.com/bedrock-tool/bedrocktool/issues
    y adjunta la información del error, describe qué hiciste para provocarlo y, si puedes, adjunta el archivo bedrocktool.log.
    ¡Gracias!
used_extra_debug_report:
  other: |
    NOTA: has usado extra-debug, que crea los archivos packets.log y packets.log.gpg.
    Si quieres enviar una incidencia, sube solo el archivo packets.log.gpg.
    packets.log y packets.log.gpg pueden incluir datos de la cuenta (nunca datos de inicio de sesión), así que es más seguro subir el archivo cifrado.
    Ese archivo solo lo puede leer el desarrollador, no quien mire la página pública de incidencias.
