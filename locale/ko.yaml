fatal_error:
  other: "치명적인 오류가 발생했습니다."
report_issue:
  other: |
    이 오류를 신고하려면 다음 주소에서 issue를 열어 주세요:
    https://github.com/bedrock-tool/bedrocktool/issues
    오류 정보를 첨부하고, 오류가 나기까지 무엇을 했는지 설명하고, 가능하면 bedrocktool.log 파일도 첨부해 주세요.
    감사합니다!
used_extra_debug_report:
  other: |
    참고: extra-debug를 사용해서 packets.log와 packets.log.gpg 파일이 만들어졌습니다.
    issue를 보내려면 packets.log.gpg 파일만 올려 주세요.
    packets.log와 packets.log.gpg에는 계정 정보가 들어 있을 수 있으므로(로그인 정보는 절대 없음) 암호화된 파일을 올리는 것이 더 안전합니다.
    그 파일은 개발자만 읽을 수 있고, 공개 issue 페이지를 보는 사람은 읽을 수 없습니다.
