report_issue:
  other: |
    Bu hatayı bildirmek istersen şurada bir issue aç:
    https://github.com/bedrock-tool/bedrocktool/issues
    Hata bilgisini ekle, hatayı almak için ne yaptığını anlat ve mümkünse bedrocktool.log dosyasını ekle.
    Teşekkürler!
used_extra_debug_report:
  other: |
    NOT: extra-debug kullandın; bu, packets.log ve packets.log.gpg dosyalarını oluşturur.
    Bir issue göndermek istersen yalnızca packets.log.gpg dosyasını yükle.
    packets.log ve packets.log.gpg hesap bilgisi içerebilir (giriş bilgisi asla), bu yüzden şifreli dosyayı yüklemek daha güvenlidir.
    O dosyayı yalnızca geliştirici okuyabilir, herkese açık issue sayfasına bakanlar okuyamaz.
