report_issue:
  other: |
    Jeśli chcesz zgłosić ten błąd, otwórz zgłoszenie na
    https://github.com/bedrock-tool/bedrocktool/issues
    i dołącz informacje o błędzie, opisz, co robiłeś, gdy się pojawił, i jeśli możesz, dołącz plik bedrocktool.log.
    Dzięki!
used_extra_debug_report:
  other: |
    UWAGA: użyto extra-debug, które tworzy pliki packets.log i packets.log.gpg.
    Jeśli chcesz wysłać zgłoszenie, wgraj tylko plik packets.log.gpg.
    packets.log i packets.log.gpg mogą zawierać dane konta (nigdy dane logowania), więc bezpieczniej jest wgrać zaszyfrowany plik.
    Ten plik może odczytać tylko twórca, a nie osoby przeglądające publiczną stronę zgłoszeń.
