report_issue:
  other: |
    Si tu veux signaler cette erreur, ouvre un ticket sur
    https://github.com/bedrock-tool/bedrocktool/issues
    et joins les infos de l'erreur, décris ce que tu faisais quand elle est arrivée et, si possible, joins le fichier bedrocktool.log.
    Merci !
used_extra_debug_report:
  other: |
    NOTE : tu as utilisé extra-debug, qui crée les fichiers packets.log et packets.log.gpg.
    Si tu veux ouvrir un ticket, envoie seulement le fichier packets.log.gpg.
    packets.log et packets.log.gpg peuvent contenir des infos du compte (jamais les identifiants), il est donc plus sûr d'envoyer le fichier chiffré.
    Seul le développeur peut lire ce fichier, pas les personnes qui consultent la page publique des tickets.
