fatal_error:
  other: "Ein schwerer Fehler ist aufgetreten."
report_issue:
  other: |
    Wenn du diesen Fehler melden möchtest, öffne bitte ein Issue unter
    https://github.com/bedrock-tool/bedrocktool/issues
    und füge die Fehlerinfos hinzu, beschreibe, was du getan hast, und hänge wenn möglich die Datei bedrocktool.log an.
    Danke!
used_extra_debug_report:
  other: |
    HINWEIS: Du hast extra-debug verwendet, das eine packets.log und eine packets.log.gpg erstellt.
    Wenn du ein Issue meldest, lade bitte nur die Datei packets.log.gpg hoch.
    packets.log und packets.log.gpg können Kontoinfos enthalten (nie Anmeldedaten), daher ist es sicherer, die verschlüsselte Datei hochzuladen.
    Diese Datei kann nur der Entwickler lesen, nicht die Leute, die sich die öffentlichen Issues ansehen.
