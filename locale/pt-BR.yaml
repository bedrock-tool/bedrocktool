    Se quiser relatar este erro, abra uma issue em
    https://github.com/bedrock-tool/bedrocktool/issues
    e anexe as informações do erro, descreva o que você fez para causá-lo e, se possível, anexe o arquivo bedrocktool.log.
    Obrigado!
used_extra_debug_report:
  other: |
    OBSERVAÇÃO: você usou extra-debug, que cria os arquivos packets.log e packets.log.gpg.
    Se quiser abrir uma issue, envie apenas o arquivo packets.log.gpg.
    packets.log e packets.log.gpg podem conter informações da conta (nunca dados de login), então é mais seguro enviar o arquivo criptografado.
    Só o desenvolvedor consegue ler esse arquivo, não quem olha a página pública de issues.
