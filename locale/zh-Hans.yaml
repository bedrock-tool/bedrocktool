report_issue:
  other: |
    如果你想报告这个错误，请在以下地址提交 issue：
    https://github.com/bedrock-tool/bedrocktool/issues
    附上错误信息，描述你做了什么导致了这个错误，如果可以，请附上 bedrocktool.log 文件。
    谢谢！
used_extra_debug_report:
  other: |
    注意：你使用了 extra-debug，它会生成 packets.log 和 packets.log.gpg 文件。
    如果要提交 issue，请只上传 packets.log.gpg 文件。
    packets.log 和 packets.log.gpg 可能包含账号信息（绝不包含登录信息），所以上传加密文件更安全。
    这个文件只有开发者能读，查看公开 issue 页面的人读不了。
